<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corte | DekoorHouse</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/corte/style.css?v=1">
</head>
<body>

<!-- Iconos (sprite local: la pantalla vive junto a la máquina y no depende de un CDN) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v13"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></symbol>
    <symbol id="i-find" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-cut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.12 15.88"/><path d="M14.47 14.48L20 20"/><path d="M8.12 8.12L12 12"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
    <symbol id="i-zip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h6l2 2h8v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M12 10v6M9.5 13h5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 12V5a2 2 0 0 1 2-2h7l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/></symbol>
</svg>

<div id="loading-overlay">
    <div class="loading-box">
        <img src="/favicon.png" class="loading-logo" alt="Cargando...">
    </div>
</div>

<!-- LOGIN -->
<div id="seccionLogin" class="oculto">
    <div class="login-container">
        <h1><svg class="ico"><use href="#i-cut"/></svg> Corte</h1>
        <form id="formularioLogin">
            <div>
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" required placeholder="tu.correo@ejemplo.com" autocomplete="username">
            </div>
            <div>
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="--------" autocomplete="current-password">
            </div>
            <div id="mensajeError"></div>
            <button type="submit">Ingresar</button>
        </form>
    </div>
</div>

<!-- APP -->
<div id="seccionApp" class="oculto">
    <aside class="rail">
        <div class="rail-marca">
            <svg class="ico"><use href="#i-cut"/></svg> Corte
        </div>
        <button id="btnSubir" class="btn-subir">
            <svg class="ico"><use href="#i-up"/></svg> Subir SVG
        </button>
        <nav id="carpetas" class="carpetas" aria-label="Filtros"></nav>
        <div class="rail-pie">
            <div id="resumenPeso" class="resumen"></div>
            <button id="btnSalir" class="btn-salir">
                <svg class="ico"><use href="#i-out"/></svg> Salir
            </button>
        </div>
    </aside>

    <main class="main">
        <header class="head">
            <div class="head-row">
                <div class="buscador">
                    <svg class="ico"><use href="#i-find"/></svg>
                    <input type="search" id="inputBuscar" placeholder="Buscar por pedido o nombre: DH15412, Ana, Spiderman…" autocomplete="off">
                    <button id="btnLimpiar" class="btn-limpiar oculto" title="Limpiar búsqueda">
                        <svg class="ico"><use href="#i-x"/></svg>
                    </button>
                </div>
                <div class="vista">
                    <button id="btnLista" aria-pressed="true" title="Lista"><svg class="ico"><use href="#i-list"/></svg></button>
                    <button id="btnCuadricula" aria-pressed="false" title="Cuadrícula"><svg class="ico"><use href="#i-grid"/></svg></button>
                </div>
            </div>
            <div id="ruta" class="ruta"></div>
        </header>

        <div id="contenido" class="contenido"></div>

        <div id="barraSeleccion" class="barra-seleccion oculto">
            <span id="textoSeleccion"></span>
            <button id="btnZip" class="bs-primario"><svg class="ico"><use href="#i-zip"/></svg> Descargar ZIP</button>
            <button id="btnBorrarVarios" class="bs-borrar"><svg class="ico"><use href="#i-trash"/></svg> Borrar</button>
            <button id="btnQuitarSeleccion" class="bs-ghost">Quitar selección</button>
        </div>
    </main>

    <!-- Capa de arrastre: aparece cuando traes archivos encima -->
    <div id="zonaSoltar" class="zona-soltar">
        <div class="zs-caja">
            <svg class="ico"><use href="#i-up"/></svg>
            <b>Suelta los SVG aquí</b>
            <span>Se guardan y se les genera la miniatura</span>
        </div>
    </div>

    <!-- Vista previa grande -->
    <div id="visor" class="visor oculto" role="dialog" aria-modal="true" aria-label="Vista previa">
        <div class="visor-caja">
            <div class="visor-head">
                <div>
                    <h2 id="visorNombre"></h2>
                    <div id="visorDatos" class="visor-datos"></div>
                </div>
                <button id="visorCerrar" class="btn-icono" title="Cerrar"><svg class="ico"><use href="#i-x"/></svg></button>
            </div>
            <div class="visor-lienzo"><img id="visorImagen" alt=""></div>
            <div class="visor-pie">
                <button id="visorDescargar" class="bs-primario"><svg class="ico"><use href="#i-down"/></svg> Descargar SVG</button>
                <button id="visorBorrar" class="bs-borrar"><svg class="ico"><use href="#i-trash"/></svg> Borrar</button>
            </div>
        </div>
    </div>

    <input type="file" id="inputArchivos" accept=".svg,image/svg+xml" multiple class="oculto">
    <div id="aviso" class="aviso oculto"></div>
</div>

<script type="module" src="/corte/script.js?v=1"></script>
</body>
</html>
