<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería | DekoorHouse</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/galeria/style.css">
</head>
<body>

<div id="loading-overlay">
    <div class="loading-box">
        <img src="/favicon.png" class="loading-logo" alt="Cargando...">
    </div>
</div>

<!-- LOGIN -->
<div id="seccionLogin" class="oculto">
    <div class="login-container">
        <h1><i class="fas fa-images"></i> Galería</h1>
        <form id="formularioLogin">
            <div>
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" required placeholder="tu.correo@ejemplo.com">
            </div>
            <div>
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="--------">
            </div>
            <div id="mensajeError"></div>
            <button type="submit"><i class="fas fa-sign-in-alt"></i> Ingresar</button>
        </form>
    </div>
</div>

<!-- APP -->
<div id="seccionApp" class="oculto">

    <header class="barra">
        <div class="barra-fila">
            <h1><i class="fas fa-images"></i> Galería</h1>
            <div class="barra-acciones">
                <span id="contadorTotal" class="contador"></span>
                <button id="btnSalir" class="btn-icono" title="Salir"><i class="fas fa-right-from-bracket"></i></button>
            </div>
        </div>

        <div class="buscador">
            <i class="fas fa-magnifying-glass"></i>
            <input type="search" id="inputBuscar" placeholder="Busca lo que pide el cliente: perro, virgen, xv, graduación…" autocomplete="off">
            <button id="btnLimpiar" class="btn-limpiar oculto" title="Limpiar"><i class="fas fa-xmark"></i></button>
        </div>

        <div id="chipsColecciones" class="chips"></div>
    </header>

    <!-- Barra de selección: aparece al marcar fotos -->
    <div id="barraSeleccion" class="barra-seleccion oculto">
        <span id="textoSeleccion"></span>
        <div class="barra-seleccion-acciones">
            <button id="btnCopiar" class="btn-primario"><i class="fas fa-copy"></i> Copiar para pegar en el chat</button>
            <button id="btnDescargar" class="btn-secundario"><i class="fas fa-download"></i> Descargar</button>
            <button id="btnDeseleccionar" class="btn-secundario"><i class="fas fa-xmark"></i> Quitar selección</button>
        </div>
    </div>

    <main class="contenido">
        <div id="cuadricula" class="cuadricula"></div>
        <div id="vacio" class="vacio oculto">
            <i class="fas fa-camera-retro"></i>
            <p id="vacioTexto">No hay fotos que coincidan.</p>
        </div>
    </main>

    <footer class="pie">
        <label class="check-inline">
            <input type="checkbox" id="chkDescartadas">
            Ver también las descartadas por la IA
        </label>
    </footer>
</div>

<!-- VISOR / EDITOR -->
<div id="visor" class="visor oculto">
    <button id="visorCerrar" class="visor-cerrar" title="Cerrar"><i class="fas fa-xmark"></i></button>
    <button id="visorAnterior" class="visor-nav visor-nav-izq" title="Anterior"><i class="fas fa-chevron-left"></i></button>
    <button id="visorSiguiente" class="visor-nav visor-nav-der" title="Siguiente"><i class="fas fa-chevron-right"></i></button>
    <div class="visor-caja" role="dialog" aria-modal="true">
        <img id="visorImg" alt="">
        <div class="visor-info">
            <input type="text" id="visorTitulo" class="visor-titulo" placeholder="Título">
            <p id="visorDescripcion" class="visor-descripcion"></p>
            <label class="campo">Colección
                <select id="visorColeccion"></select>
            </label>
            <label class="campo">Etiquetas (separadas por coma)
                <input type="text" id="visorTags" placeholder="perro, mascota, lampara">
            </label>
            <div class="visor-acciones">
                <button id="visorGuardar" class="btn-primario"><i class="fas fa-check"></i> Guardar</button>
                <button id="visorCopiar" class="btn-secundario"><i class="fas fa-copy"></i> Copiar</button>
                <button id="visorActiva" class="btn-secundario"></button>
            </div>
            <p id="visorEstado" class="visor-estado"></p>
        </div>
    </div>
</div>

<div id="aviso" class="aviso oculto"></div>

<script type="module" src="/galeria/script.js"></script>
</body>
</html>
